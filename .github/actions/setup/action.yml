# Node 22, pnpm (from packageManager via corepack), the workspace installed, and the assets the
# Worker serves and the tests read (web, docs, CLI tarball, bundled templates). Run after checkout.
name: setup
description: Install the workspace and build what the tests read
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - name: Enable corepack (pnpm from packageManager)
      shell: bash
      run: corepack enable
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build what tests read (web, docs, CLI tarball, templates)
      shell: bash
      run: pnpm --filter @app/e2e prepare-assets
