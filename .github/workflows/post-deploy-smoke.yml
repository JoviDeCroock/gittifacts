# Tier 2 (docs/testing.md): the post-deploy smoke against the DEPLOYED platform, off the deploy
# machine. scripts/deploy-clean.sh dispatches it right after `wrangler deploy` and waits; a deploy
# workflow can `uses:` it. ≤ 5 minutes: health + the deployed commit, front door and docs, the E2E
# account signing in, the agent path (anonymous create_project → first green + preview < 120 s),
# and the GitHub webhook refusing a bad signature.
#
# On failure: rolls the Worker back to `previous_version` (when CLOUDFLARE_API_TOKEN is set, else
# deploy-clean.sh does it with the operator's wrangler login), fails the run, and opens an issue
# labelled deploy-rollback.
#
# Secrets (optional; the matching checks skip and say so without them):
#   E2E_EMAIL, E2E_PASSWORD                  the dedicated E2E account (never a person's account)
#   STAGING_E2E_EMAIL, STAGING_E2E_PASSWORD  its twin on staging (picked when the URL is staging)
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  Workers edit, for the rollback only
name: post-deploy-smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: Deployed origin
        default: https://gittifacts.decroockjovi.workers.dev
      expect_commit:
        description: The commit tag the live version must carry (12-char sha; empty = don't compare)
        default: ""
      deployed_version:
        description: Worker version id just deployed (rollback target check)
        default: ""
      previous_version:
        description: Worker version id to roll back to on failure (empty = no rollback)
        default: ""
      rollback_dry_run:
        description: Rehearse the rollback (print what would run, change nothing)
        type: boolean
        default: false
  workflow_call:
    inputs:
      url: { type: string, default: "https://gittifacts.decroockjovi.workers.dev" }
      expect_commit: { type: string, default: "" }
      deployed_version: { type: string, default: "" }
      previous_version: { type: string, default: "" }
      rollback_dry_run: { type: boolean, default: false }
    secrets:
      E2E_EMAIL: { required: false }
      E2E_PASSWORD: { required: false }
      STAGING_E2E_EMAIL: { required: false }
      STAGING_E2E_PASSWORD: { required: false }
      CLOUDFLARE_API_TOKEN: { required: false }
      CLOUDFLARE_ACCOUNT_ID: { required: false }

permissions:
  contents: read
  issues: write

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Inputs pass through env, never interpolated into scripts (no injection).
      SMOKE_BASE_URL: ${{ inputs.url }}
      SMOKE_EXPECT_COMMIT: ${{ inputs.expect_commit }}
      DEPLOYED_VERSION: ${{ inputs.deployed_version }}
      PREVIOUS_VERSION: ${{ inputs.previous_version }}
      ROLLBACK_DRY_RUN: ${{ inputs.rollback_dry_run && '1' || '' }}
      # Staging has its own database, so its own E2E account; GitHub mode is off there.
      E2E_EMAIL: ${{ inputs.url == 'https://gittifacts-staging.decroockjovi.workers.dev' && secrets.STAGING_E2E_EMAIL || secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ inputs.url == 'https://gittifacts-staging.decroockjovi.workers.dev' && secrets.STAGING_E2E_PASSWORD || secrets.E2E_PASSWORD }}
      SMOKE_GITHUB: ${{ inputs.url == 'https://gittifacts-staging.decroockjovi.workers.dev' && 'off' || 'on' }}
      CI: "1"
    steps:
      - name: Only send credentials to our own deployments
        env:
          TARGET: ${{ inputs.url }}
        run: |
          case "$TARGET" in
            ""|https://gittifacts.decroockjovi.workers.dev|https://gittifacts-staging.decroockjovi.workers.dev) ;;
            *) echo "::error::url must be production or staging, got: $TARGET"; exit 1 ;;
          esac
      - name: Mask credentials in logs
        run: |
          for v in "$E2E_EMAIL" "$E2E_PASSWORD"; do [ -n "$v" ] && echo "::add-mask::$v"; done; true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install (the e2e package only)
        run: corepack enable && pnpm install --frozen-lockfile --filter "@app/e2e..."
      - name: Browser
        run: pnpm --filter @app/e2e exec playwright install --with-deps chromium
      - name: Smoke
        id: smoke
        run: pnpm --filter @app/e2e smoke
      - name: No secret in the report (deletes it and fails otherwise)
        id: scan
        if: always()
        env:
          SECRET_ENV: E2E_EMAIL,E2E_PASSWORD
        run: node scripts/check-report-secrets.mjs apps/e2e/playwright-report/smoke apps/e2e/test-results
      - name: Report
        if: always() && steps.scan.outcome == 'success'
        run: node scripts/e2e-summary.mjs apps/e2e/test-results/smoke.json "Post-deploy smoke" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.scan.outcome == 'success'
        with:
          name: smoke-report
          path: |
            apps/e2e/playwright-report/smoke
            apps/e2e/test-results
          retention-days: 14
      - name: Roll back
        id: rollback
        if: failure() && env.PREVIOUS_VERSION != '' && env.DEPLOYED_VERSION != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ROLLBACK_DRY_RUN" ]; then
            scripts/rollback.sh --url "$SMOKE_BASE_URL" --deployed "$DEPLOYED_VERSION" --to "$PREVIOUS_VERSION" \
              --reason "rehearsal (run $GITHUB_RUN_ID)" --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
            echo "outcome=dry-run (nothing changed)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "outcome=left-to-deploy-clean" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN: scripts/deploy-clean.sh rolls back with the operator's login."
            exit 0
          fi
          export WRANGLER="npx --yes wrangler@4.145.0"
          if scripts/rollback.sh --url "$SMOKE_BASE_URL" --deployed "$DEPLOYED_VERSION" --to "$PREVIOUS_VERSION" \
              --reason "post-deploy smoke failed for ${SMOKE_EXPECT_COMMIT:-unknown} (run $GITHUB_RUN_ID)"; then
            echo "outcome=rolled-back" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=rollback-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.rollback.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create deploy-rollback --color B60205 --description "A post-deploy smoke failed" 2>/dev/null || true
          {
            echo "The post-deploy smoke failed against $SMOKE_BASE_URL for commit \`${SMOKE_EXPECT_COMMIT:-?}\`."
            echo
            echo "- Deployed version: \`${DEPLOYED_VERSION:-?}\`"
            echo "- Previous version: \`${PREVIOUS_VERSION:-none given}\`"
            echo "- Rollback: **${OUTCOME:-not attempted}**"
            echo "- Run: $RUN_URL (report artifact: smoke-report)"
          } > issue.md
          title="Post-deploy smoke failed: ${SMOKE_EXPECT_COMMIT:-unknown commit}"
          [ -n "$ROLLBACK_DRY_RUN" ] && title="[rehearsal] $title"
          gh issue create --title "$title" \
            --label deploy-rollback --body-file issue.md
