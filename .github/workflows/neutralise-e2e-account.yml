# ONE-OFF (2026-10-04, deleted after it ran): neutralise the E2E account whose password leaked into
# a smoke report. Uses the CURRENT E2E_* secrets (the leaked account) before they are rotated:
# revokes every token of the account and its agents, then changes the password to a random value
# that is never stored or printed (and revokes the other sessions). Prints only counts and statuses.
name: neutralise-e2e-account

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "neutralise" to run
        required: true

permissions:
  contents: read

jobs:
  neutralise:
    if: inputs.confirm == 'neutralise'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: https://gittifacts.decroockjovi.workers.dev
      OLD_EMAIL: ${{ secrets.E2E_EMAIL }}
      OLD_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      OLD_AGENT_TOKEN: ${{ secrets.E2E_AGENT_TOKEN }}
    steps:
      - name: Mask
        run: for v in "$OLD_EMAIL" "$OLD_PASSWORD" "$OLD_AGENT_TOKEN"; do [ -n "$v" ] && echo "::add-mask::$v"; done; true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revoke tokens, scramble the password
        run: |
          cat > n.mjs <<'EOF'
          import { randomBytes, randomUUID } from "node:crypto";
          const H = process.env.HOST;
          const j = { "content-type": "application/json", origin: H };
          const signIn = await fetch(`${H}/api/auth/sign-in/email`, {
            method: "POST", headers: j,
            body: JSON.stringify({ email: process.env.OLD_EMAIL, password: process.env.OLD_PASSWORD }),
          });
          console.log("sign-in", signIn.status);
          if (!signIn.ok) process.exit(1);
          const cookie = signIn.headers.getSetCookie().map((c) => c.split(";")[0]).join("; ");
          const auth = { ...j, cookie };
          const list = await (await fetch(`${H}/api/v1/principals`, { headers: auth })).json();
          const agents = list.principals.filter((p) => p.kind === "agent");
          console.log("agents", agents.length);
          for (const a of agents) {
            const r = await fetch(`${H}/api/v1/principals/${a.id}/tokens`, {
              method: "DELETE", headers: { ...auth, "idempotency-key": randomUUID() },
            });
            console.log("revoke agent", a.id, r.status, r.ok ? (await r.json()).revoked : "");
          }
          // The old agent token must now be refused.
          const probe = await fetch(`${H}/api/v1/me`, { headers: { authorization: `Bearer ${process.env.OLD_AGENT_TOKEN}` } });
          console.log("old agent token on /api/v1/me", probe.status);
          const pw = await fetch(`${H}/api/auth/change-password`, {
            method: "POST", headers: auth,
            body: JSON.stringify({
              currentPassword: process.env.OLD_PASSWORD,
              newPassword: randomBytes(32).toString("base64url"),
              revokeOtherSessions: true,
            }),
          });
          console.log("change-password", pw.status);
          const again = await fetch(`${H}/api/auth/sign-in/email`, {
            method: "POST", headers: j,
            body: JSON.stringify({ email: process.env.OLD_EMAIL, password: process.env.OLD_PASSWORD }),
          });
          console.log("sign-in with the leaked password now", again.status);
          if (!pw.ok || again.ok || probe.status !== 401) process.exit(1);
          EOF
          node n.mjs
